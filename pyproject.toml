[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsm-tools"
version = "0.3.0"
authors = [
    {name = "biface", email = "fek2qe8i3@mozmail.com"}
]
description = "Formal automata for the Chomsky hierarchy — pure Python."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: CeCILL-C Free Software License Agreement (CECILL-C)",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage   = "https://fsm-tools.readthedocs.io"
Repository = "https://github.com/biface/automata"
Issues     = "https://github.com/biface/automata/issues"

# -----------------------------------------------------------------------------
# Optional dependencies
#
# Only the entry point for local dev remains here (`pip install -e .[dev]`).
# Everything tox/CI/RTD actually run against lives in .tox-config/requirements/*.txt
# (base.txt, docs.txt, format.txt, linter.txt, security.txt, type-check.txt, full.txt)
# so there is a single source of truth per concern instead of two:
#   - no separate `docs` extra: see .tox-config/requirements/docs.txt (DD — 2026-09-02,
#     ensures exact parity between local `tox -e docs` and ReadTheDocs builds)
#   - no separate `test` extra: it duplicated base.txt without ever being consumed
#     by tox, which always installs from .tox-config/requirements/base.txt directly
# -----------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "bandit",
    "basedpyright",
    "black",
    "flake8",
    "isort",
    "pytest",
    "pytest-cov",
    "tox>=4.21",
    "tox-uv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short --strict-markers"

[tool.coverage.run]
source_pkgs = ["fsm_tools"]
branch = true

[tool.coverage.report]
#fail_under   = 80
show_missing = true

[tool.coverage.html]
directory = "coverage/coverage_html"
title = "Code Coverage Report"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.black]
line-length    = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile                     = "black"
line_length                 = 100
known_first_party           = "fsm_tools"
multi_line_output           = 3
include_trailing_comma      = true
force_grid_wrap             = 0
use_parentheses             = true
ensure_newline_before_comments = true

# =============================================================================
# tox — test orchestration
#
# Migrated from tox.ini to native [tool.tox] (tox >= 4.21) — single config
# file, one less thing to keep in sync with pyproject.toml. Behaviour is
# unchanged: same env names, same requirements files, same commands.
#
# Environment naming and deps unchanged from tox.ini (2026-09-02 migration):
#   Quality : basedpyright, flake8, black-check, isort-check, bandit
#   Tests   : py310, py311, py312, py313, py314
#   Extras  : black, isort, format (auto-fix), coverage, docs, pre-push,
#             ci-quality, local (alias)
#
# Scripts shared across environments (unchanged):
#   .tox-config/scripts/test.sh       reads versions.txt
#   .tox-config/scripts/coverage.sh   reads coverage-version.txt
# =============================================================================
[tool.tox]
requires = ["tox>=4.21", "tox-uv"]
env_list = [
    "py310", "py311", "py312", "py313", "py314",
    "basedpyright", "flake8", "black-check", "isort-check", "bandit",
    "black", "isort", "format",
    "pre-push", "ci-quality", "coverage", "docs", "local",
]

[tool.tox.gh_actions]
python = { "3.10" = "py310", "3.11" = "py311", "3.12" = "py312", "3.13" = "py313", "3.14" = "py314" }

# Base for all per-Python-version test environments (py310..py314).
# Quality/auto-fix/coverage/docs environments override deps and commands entirely.
[tool.tox.env_run_base]
uv_seed = true
setenv   = { PYTHONPATH = "{toxinidir}/src:{toxinidir}/tests" }
deps     = ["-r {toxinidir}/.tox-config/requirements/base.txt"]
commands = [
    ["pytest", "--import-mode=importlib", "--cov=fsm_tools", "--cov-report=term-missing"],
]

[tool.tox.env.py310]
base_python = "python3.10"

[tool.tox.env.py311]
base_python = "python3.11"

[tool.tox.env.py312]
base_python = "python3.12"

[tool.tox.env.py313]
base_python = "python3.13"

[tool.tox.env.py314]
base_python = "python3.14"

# =============================================================================
# Individual verification tools
# =============================================================================

[tool.tox.env.basedpyright]
description         = "Type checking with basedpyright"
deps                = ["-r {toxinidir}/.tox-config/requirements/type-check.txt"]
allowlist_externals = ["bash"]
commands            = [
    ["bash", "-c", "basedpyright src; code=$?; [ $code -le 1 ]"],
]

[tool.tox.env.flake8]
description = "Lint the code with flake8"
deps        = ["-r {toxinidir}/.tox-config/requirements/linter.txt"]
commands    = [
    ["flake8",
     "--max-line-length=100",
     "--extend-ignore=E203,W503,E501",
     "--exclude=.tox,.git,__pycache__,build,dist,.eggs,*.egg",
     "--per-file-ignores=tests/*:F401,F841,E711,E712,E731,F811,F541 src/fsm_tools/__init__.py:F401",
     "src", "tests"],
]

[tool.tox.env."black-check"]
description = "Check code formatting with black (no changes)"
deps        = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
commands    = [["black", "--check", "--diff", "--target-version", "py310", "src", "tests"]]

[tool.tox.env."isort-check"]
description = "Check import sorting with isort (no changes)"
deps        = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
commands    = [["isort", "--check-only", "--diff", "src", "tests"]]

[tool.tox.env.bandit]
description = "Run security analysis with bandit"
deps        = ["-r {toxinidir}/.tox-config/requirements/security.txt"]
commands    = [["bandit", "-r", "src"]]

# =============================================================================
# Auto-fix tools (local only)
# =============================================================================

[tool.tox.env.black]
description = "Auto-format code with black"
deps        = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
commands    = [["black", "--target-version", "py310", "src", "tests"]]

[tool.tox.env.isort]
description = "Auto-sort imports with isort"
deps        = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
commands    = [["isort", "src", "tests"]]

[tool.tox.env.format]
description = "Auto-format code (black + isort)"
deps        = ["-r {toxinidir}/.tox-config/requirements/format.txt"]
commands    = [
    ["black", "--target-version", "py310", "src", "tests"],
    ["isort", "src", "tests"],
]

# =============================================================================
# Coverage
# =============================================================================

[tool.tox.env.coverage]
description = "Produce python test coverage using pytest"
base_python = "python3.12"
deps        = ["-r {toxinidir}/.tox-config/requirements/base.txt"]
commands    = [
    ["pytest", "--import-mode=importlib",
     "--cov=fsm_tools",
     "--cov-append",
     "--cov-report=term-missing",
     "--cov-report=xml:{toxinidir}/coverage/coverage.xml",
     "--cov-report=html:{toxinidir}/coverage/coverage_html", "tests"],
]

# =============================================================================
# Documentation build (Sphinx + Furo)
#
# Single source of truth for doc deps: .tox-config/requirements/docs.txt.
# .readthedocs.yaml points at the same file, so `tox -e docs` locally and the
# RTD build install the exact same set of packages.
# =============================================================================

[tool.tox.env.docs]
description = "Build Sphinx documentation (docs/source -> docs/_build/html)"
base_python = "python3.12"
deps        = ["-r {toxinidir}/.tox-config/requirements/docs.txt"]
commands    = [["sphinx-build", "-b", "html", "docs/source", "docs/_build/html"]]

# =============================================================================
# Local workflow (pre-push)
# =============================================================================

[tool.tox.env."pre-push"]
description         = "Complete local workflow before push (format + checks + tests)"
deps                = ["-r {toxinidir}/.tox-config/requirements/full.txt"]
allowlist_externals = ["bash"]
passenv             = ["HOME", "USER"]
commands            = [
    ["black", "--target-version", "py310", "src", "tests"],
    ["isort", "src", "tests"],
    ["bash", "-c", "basedpyright src; code=$?; [ $code -le 1 ]"],
    ["flake8",
     "--max-line-length=100",
     "--extend-ignore=E203,W503,E501",
     "--exclude=.tox,.git,__pycache__,build,dist,.eggs,*.egg",
     "--per-file-ignores=tests/*:F401,F841,E711,E712,E731,F811,F541 src/fsm_tools/__init__.py:F401",
     "src", "tests"],
    ["bandit", "-r", "src"],
    ["bash", "{toxinidir}/.tox-config/scripts/test.sh"],
    ["bash", "{toxinidir}/.tox-config/scripts/coverage.sh"],
]

# =============================================================================
# CI/CD workflow (GitHub Actions)
# =============================================================================

[tool.tox.env."ci-quality"]
description         = "CI quality checks (no auto-fix, only verify)"
deps                = ["-r {toxinidir}/.tox-config/requirements/full.txt"]
allowlist_externals = ["bash"]
commands            = [
    ["bash", "-c", "basedpyright src; code=$?; [ $code -le 1 ]"],
    ["flake8",
     "--max-line-length=100",
     "--extend-ignore=E203,W503,E501",
     "--exclude=.tox,.git,__pycache__,build,dist,.eggs,*.egg",
     "--per-file-ignores=tests/*:F401,F841,E711,E712,E731,F811,F541 src/fsm_tools/__init__.py:F401",
     "src", "tests"],
    ["black", "--check", "--diff", "--target-version", "py310", "src", "tests"],
    ["isort", "--check-only", "--diff", "src", "tests"],
    ["bandit", "-r", "src"],
]

# =============================================================================
# Aliases
#
# NOTE: TOML's [tool.tox.env.*] tables don't support the ini-style
# `{[testenv:pre-push]commands}` base-substitution for list-typed keys, so
# `local` duplicates `pre-push`'s deps/commands verbatim rather than
# referencing it. Keep the two in sync by hand if `pre-push` changes.
# =============================================================================

[tool.tox.env.local]
description         = "Alias for pre-push (backward compatibility)"
deps                = ["-r {toxinidir}/.tox-config/requirements/full.txt"]
allowlist_externals = ["bash"]
passenv             = ["HOME", "USER"]
commands            = [
    ["black", "--target-version", "py310", "src", "tests"],
    ["isort", "src", "tests"],
    ["bash", "-c", "basedpyright src; code=$?; [ $code -le 1 ]"],
    ["flake8",
     "--max-line-length=100",
     "--extend-ignore=E203,W503,E501",
     "--exclude=.tox,.git,__pycache__,build,dist,.eggs,*.egg",
     "--per-file-ignores=tests/*:F401,F841,E711,E712,E731,F811,F541 src/fsm_tools/__init__.py:F401",
     "src", "tests"],
    ["bandit", "-r", "src"],
    ["bash", "{toxinidir}/.tox-config/scripts/test.sh"],
    ["bash", "{toxinidir}/.tox-config/scripts/coverage.sh"],
]
